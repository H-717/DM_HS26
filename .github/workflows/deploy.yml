name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 20 is EOL and warned on commander@15 wanting node >=22.12.
          node-version: 24
          cache: npm
      # Not `npm ci`: @napi-rs/wasm-runtime declares @emnapi/core and
      # @emnapi/runtime as optional peerDependencies, and npm on Windows
      # (where this lock is written) leaves them out of the tree while npm
      # on Linux expects them in it. `npm ci` treats that as the lock being
      # out of sync and refuses to install. Nothing imports those packages —
      # they sit behind rolldown's wasm32-wasi fallback, which a Linux
      # runner never uses. `npm install` still honours the lock for every
      # package that is in it, and resolves this one branch itself.
      - run: npm install --no-audit --no-fund
      # Seals speaker notes and unreleased solutions — see vite.config.ts.
      - run: npm run build
        env:
          ADMIN_PHRASE: ${{ secrets.SECRET_DM }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
